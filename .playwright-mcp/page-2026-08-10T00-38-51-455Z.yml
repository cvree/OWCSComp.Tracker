                - heading "The Metamorphoses" [level=3] [ref=f1e646]
                - paragraph [ref=f1e647]: Fifteen books of Latin hexameter finished in 8 CE, the year Ovid was exiled to the Black Sea. No copy in his own hand survives; everything we have descends from medieval manuscripts.
