              - heading "What do we actually know?" [level=2] [ref=f1e654]
            - paragraph [ref=f1e656]: Every claim in this story is graded. Nothing is quietly promoted from legend to fact.
            - group "Filter by confidence" [ref=f1e657]:
              - button "All 8" [ref=f1e658] [cursor=pointer]
              - button "Myth" [ref=f1e659] [cursor=pointer]
              - button "Documented" [ref=f1e660] [cursor=pointer]
              - button "Likely" [ref=f1e661] [cursor=pointer]
