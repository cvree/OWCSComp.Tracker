              - button "Popular but unsupported" [ref=f1e664] [cursor=pointer]
            - list [ref=f1e665]:
              - listitem [ref=f1e666]:
                - generic [ref=f1e674]:
                  - paragraph [ref=f1e675]: Myth
                  - paragraph [ref=f1e676]: The flight itself — the wings, the sun, the fall.
                  - paragraph [ref=f1e677]: This belongs entirely to the story-world. There is no ancient claim that it was witnessed or recorded, and no ancient author treats it as reportage.
              - listitem [ref=f1e678]:
                - generic [ref=f1e686]:
                  - paragraph [ref=f1e687]: Documented
                  - paragraph [ref=f1e688]: The story is old and was told across the Greek and Roman world.
                  - paragraph [ref=f1e689]: Icarus appears in Greek art and reference long before Rome, and the fullest surviving narrative is Ovid’s, published in 8 CE. Apollodorus, Diodorus, Hyginus and Pausanias all preserve variants — which is how we know Ovid was shaping an inherited story, not inventing one.
              - listitem [ref=f1e690]:
                - generic [ref=f1e698]:
                  - paragraph [ref=f1e699]: Documented
                  - paragraph [ref=f1e700]: The places are real and were named after him in antiquity.
                  - paragraph [ref=f1e701]: The island of Ikaria and the stretch of Aegean around it — the Icarian Sea — carried the name in classical antiquity, and still do. Strabo records the association.
              - listitem [ref=f1e702]:
                - generic [ref=f1e710]:
                  - paragraph [ref=f1e711]: Likely
                  - paragraph [ref=f1e712]: A wealthy, complex palace society really did dominate Bronze Age Crete.
                  - paragraph [ref=f1e713]: Excavations at Knossos from 1900 revealed an enormous multi-storey administrative complex with hundreds of interconnected rooms. That is a real civilisation with real reach — and a plausible seedbed for stories about a king, a maze-like palace, and a bull cult.
              - listitem [ref=f1e714]:
                - generic [ref=f1e722]:
                  - paragraph [ref=f1e723]: Disputed
                  - paragraph [ref=f1e724]: “Labyrinth” comes from *labrys*, the Minoan double axe.
                  - paragraph [ref=f1e725]: It is a popular and attractive derivation — the double axe is everywhere at Knossos. But the word is pre-Greek and the etymology is genuinely unresolved; specialists disagree, and the *labrys* link is a nineteenth-century proposal, not a settled fact.
              - listitem [ref=f1e726]:
                - generic [ref=f1e734]:
                  - paragraph [ref=f1e735]: Later tradition
                  - paragraph [ref=f1e736]: Icarus is a warning against pride.
                  - paragraph [ref=f1e737]: This reading hardens in the medieval and Renaissance moralising tradition. In Ovid the boy is not proud — he is *captured by desire for the sky*, and the emotional weight of the passage falls on his father’s grief.
              - listitem [ref=f1e738]:
                - generic [ref=f1e746]:
                  - paragraph [ref=f1e747]: Popular but unsupported
                  - paragraph [ref=f1e748]: Daedalus only warned him about the sun.
                  - paragraph [ref=f1e749]: "Repeated constantly. It is half the instruction. The text gives a two-sided limit: too low and the sea weighs the wings down, too high and the fire scorches them. Deleting the lower bound turns a lesson about moderation into a lesson about ambition."
              - listitem [ref=f1e750]:
                - generic [ref=f1e758]:
                  - paragraph [ref=f1e759]: Popular but unsupported
                  - paragraph [ref=f1e760]: The wax melted because he got close to the sun’s heat.
                  - paragraph [ref=f1e761]: It is the story’s internal physics, not the world’s. Air gets colder with altitude, not hotter. This is a poetic mechanism, and treating it as a physics claim misreads the genre.
          - region "Memorable facts" [ref=f1e762]:
            - heading "Worth remembering" [level=2] [ref=f1e764]
            - list [ref=f1e766]:
              - listitem [ref=f1e767]:
                - generic [ref=f1e768]: "01"
                - paragraph [ref=f1e769]: The warning had two halves. Sea spray below, sun above. Icarus was told to hold the middle — and “hold the middle” is a far less flattering moral than “don’t be ambitious.”
              - listitem [ref=f1e770]:
                - generic [ref=f1e771]: "02"
                - paragraph [ref=f1e772]: The Icarian Sea is on modern nautical charts. A stretch of the Aegean is named after a boy who never existed.
              - listitem [ref=f1e773]:
                - generic [ref=f1e774]: "03"
                - paragraph [ref=f1e775]: In Ovid, the last person we see is Daedalus, cursing his own hands over open water.
              - listitem [ref=f1e776]:
                - generic [ref=f1e777]: "04"
                - paragraph [ref=f1e778]: "Diodorus Siculus preserves a deflationary version: they escaped by boat, and Icarus simply fell overboard. Ancient writers were already trying to make the story sensible."
              - listitem [ref=f1e779]:
                - generic [ref=f1e780]: "05"
                - paragraph [ref=f1e781]: Bruegel painted the fall so small that most people never find it.
