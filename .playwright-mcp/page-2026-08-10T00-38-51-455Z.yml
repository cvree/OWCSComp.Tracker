          - paragraph [ref=f1e194]: A traditional story about gods, origins and meaning. Not a record of events.
        - generic [ref=f1e195]:
          - paragraph [ref=f1e196]: The trick to this story is that you already know the ending, and you still have it wrong.
          - paragraph [ref=f1e197]: A man and his son are locked on an island. The man is the finest engineer alive. He looks at the one road out that nobody is guarding — straight up — and he builds it. Then he tells his boy the two rules that will keep him alive. The boy breaks one of them.
          - paragraph [ref=f1e198]: That much you know. What gets lost, every single time, is which rule he was actually given, and who the story is punishing.
        - generic [ref=f1e199]:
          - heading "The man who built the problem" [level=2] [ref=f1e200]
          - paragraph [ref=f1e201]: "Daedalus was the sort of craftsman other craftsmen tell stories about. In the Greek imagination he is the origin point of made things: the first statues with their eyes open and their legs apart, as though about to walk. He was Athenian, and he left Athens in a hurry — the tradition says he threw his own nephew off the Acropolis for being more talented than he was."
          - paragraph [ref=f1e202]: He landed on Crete, at the court of King Minos, and there he did the work that would trap him. Minos’s wife Pasiphaë had conceived a child by a bull. The child grew. It had to be kept somewhere. So Daedalus designed a building with no room in it that could be understood from inside — the Labyrinth — and shut the Minotaur into the middle of it.
          - paragraph [ref=f1e203]: "Then Minos’s daughter Ariadne fell in love with a visiting Athenian, and Daedalus — who could not help himself — told her the trick: a thread. Theseus went in, killed the thing, and followed the thread back out."
          - paragraph [ref=f1e204]: Minos worked out very quickly who had given away the secret. And a king who owns the only harbours on an island does not need a prison. He simply announces that no ship will carry you.
        - complementary [ref=f1e205]:
          - generic [ref=f1e206]: “
          - blockquote [ref=f1e207]: He may block the land and the sea, but the sky is open.
          - generic [ref=f1e208]: Daedalus, in Ovid’s Metamorphoses
        - generic [ref=f1e209]:
          - heading "Feathers, thread, wax" [level=2] [ref=f1e210]
          - paragraph [ref=f1e211]: Ovid describes the build the way you would describe a real object being made, which is part of why it has lasted two thousand years. Daedalus lays out feathers in a row, shortest to longest, so the edge steps up like a rustic pan-pipe. He binds the middles with linen thread and seals the bases with wax. Then he bends the whole assembly into a gentle curve, because that is the shape a real bird’s wing has.
          - paragraph [ref=f1e212]: "And the boy is underfoot the whole time. This is the detail that gives the passage its terrible domestic weight: Icarus keeps grabbing at the feathers as they drift, mashing the yellow wax with his thumb, getting in the way of the work. He is playing with the thing that is going to kill him, and his father is smiling at him while he does it."
        - figure "Ovid gives Daedalus a working method, not a miracle. That is why it feels true." [ref=f1e213]:
          - img "Daedalus laying out graded rows of feathers on a workbench while Icarus reaches for one drifting in the air." [ref=f1e215]
        - complementary [ref=f1e312]:
          - paragraph [ref=f1e313]: The half everybody forgets
          - paragraph [ref=f1e314]:
            - generic [ref=f1e315]:
              - text: The warning is not “don’t fly too high.” It is a corridor. Fly too low and sea spray soaks the feathers and drags you down. Fly too high and the sun softens the wax. Daedalus tells him to hold the middle — and the Latin word Ovid uses for that instruction,
              - emphasis [ref=f1e316]: medio
              - text: ", is the same idea Greek ethics had been circling for centuries. The moral of Icarus is not “don’t be ambitious.” It is “don’t be extreme.”"
        - generic [ref=f1e317]:
          - heading "The flight" [level=2] [ref=f1e318]
          - paragraph [ref=f1e319]: "They go up. Below them, a fisherman with a trembling rod, a shepherd on his crook, a ploughman at his handles — all three stop and look up and decide they are watching gods. Ovid puts those three men in for a reason: it is the only moment in the story where the flight is beautiful and nothing has gone wrong yet."
          - paragraph [ref=f1e320]:
            - generic [ref=f1e321]:
              - text: Then the boy starts to enjoy it. Ovid is careful here. Icarus is not proud, not defiant, not making a point. He is
              - emphasis [ref=f1e322]: delighted
              - text: . He is a teenager who has just discovered that he can climb, so he climbs — drawn, in the poem’s phrase, by a longing for the sky. He leaves the corridor.
          - paragraph [ref=f1e323]: The sun softens the wax. The feathers come away. He beats bare arms against nothing, and the air will not hold him, and he is still calling his father’s name when the water closes over him.
        - complementary [ref=f1e324]:
          - generic [ref=f1e325]: “
          - blockquote [ref=f1e326]: He was calling his father’s name, and the blue water took it, and that water carries his name now.
        - generic [ref=f1e327]:
          - heading "Who the story is actually about" [level=2] [ref=f1e328]
          - paragraph [ref=f1e329]: Here is where most retellings stop, and here is where Ovid’s version turns.
          - paragraph [ref=f1e330]:
            - generic [ref=f1e331]:
              - text: Daedalus is still flying. He calls back. Nothing. He calls again —
              - emphasis [ref=f1e332]: Icarus, where are you?
              - text: — and then he sees the feathers on the water.
          - paragraph [ref=f1e333]: And the last thing the greatest engineer in the world ever does in this story is bury his son on an island, and curse his own hands, and his own arts.
          - paragraph [ref=f1e334]: That is the shape of it. The boy is not punished for ambition; he is a kid who got excited. The person the story destroys is the father — the man who solved an impossible problem brilliantly and completely, and lost the only thing the solution was for. Every version of this myth that ends with “and that’s why you shouldn’t reach too high” has quietly deleted the grieving man in the sky shouting a name at an empty sea.
