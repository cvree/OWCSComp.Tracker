                - heading "Silver stater of Knossos" [level=3] [ref=f1e620]
                - paragraph [ref=f1e621]: Cretan coins struck from the 5th to 1st centuries BCE carry a labyrinth on the reverse — square or round, always a single winding path. The city was advertising the myth as civic identity, a thousand years after the palace burned.
                - paragraph [ref=f1e622]: British Museum; Ashmolean; Heraklion
            - listitem [ref=f1e623]:
