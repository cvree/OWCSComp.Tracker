        - complementary [ref=f1e441]:
          - heading "The most famous painting of this is a joke about you" [level=3] [ref=f1e442]
          - paragraph [ref=f1e443]:
            - generic [ref=f1e444]:
              - text: Bruegel’s
              - emphasis [ref=f1e445]: Landscape with the Fall of Icarus
              - text: "(c. 1560, or a later copy of a lost original) is a wide, calm, gorgeous scene: a ploughman ploughing, a shepherd staring at the sky, a ship in full sail, the sun going down. It takes most people a while to find Icarus at all. He is a pair of white legs, bottom right, disappearing into the water, and not one person in the painting has noticed."
          - paragraph [ref=f1e446]:
            - generic [ref=f1e447]:
              - text: W. H. Auden built a poem around it —
              - emphasis [ref=f1e448]: Musée des Beaux Arts
              - text: "— about exactly that: how catastrophe always happens somewhere off to the side of somebody else’s ordinary afternoon."
