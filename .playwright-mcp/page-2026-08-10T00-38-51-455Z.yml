          - heading "Icarus" [level=1] [ref=f1e175]
          - paragraph [ref=f1e176]: "His father gave him one rule: don’t fly too close to the sun."
          - paragraph [ref=f1e177]: Everyone remembers the boy who ignored a warning. Almost nobody remembers that the warning had two halves — or that the story is really about his father.
          - generic [ref=f1e178]:
            - generic [ref=f1e179]: 5 min read
