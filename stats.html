<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comps — OWCS Comp Tracker</title>
<meta name="description" content="Every five-hero comp OWCS teams ran in 2026: how often, W–L, weighted win rate and tier, the maps and teams, head-to-head against other comps, bans, swaps and every game — from the community spreadsheet, beside the line-ups read off the broadcast.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/saira-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/owcs.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="shell shell--wide">

  <div class="page-head page-head--tight">
    <p class="eyebrow">Overall</p>
    <h1>Comps</h1>
    <p class="lede">Every five-hero comp OWCS teams ran this season. Pick a map or a hero,
      then open a comp for its record, matchups, bans and every game.</p>
  </div>

  <!-- The site-wide time range: every tab below follows it. Directly in
       <main> so it stays pinned under the header for the whole page. -->
  <div id="cb-range"></div>

  <div role="tablist" aria-label="Comp views" class="u-mt-4">
    <button role="tab" data-tab="comps" aria-controls="p-comps" id="t-comps">Comps</button>
    <button role="tab" data-tab="bymap" aria-controls="p-bymap" id="t-bymap">By map</button>
    <button role="tab" data-tab="heroes" aria-controls="p-heroes" id="t-heroes">Heroes</button>
    <button role="tab" data-tab="maps" aria-controls="p-maps" id="t-maps">Maps</button>
    <button role="tab" data-tab="teams" aria-controls="p-teams" id="t-teams">Teams</button>
    <button role="tab" data-tab="swaps" aria-controls="p-swaps" id="t-swaps">Swaps</button>
  </div>

  <div id="p-comps" role="tabpanel" aria-labelledby="t-comps" tabindex="0"></div>
  <div id="p-bymap" role="tabpanel" aria-labelledby="t-bymap" tabindex="0" hidden></div>
  <div id="p-heroes" role="tabpanel" aria-labelledby="t-heroes" tabindex="0" hidden></div>
  <div id="p-maps" role="tabpanel" aria-labelledby="t-maps" tabindex="0" hidden></div>
  <div id="p-teams" role="tabpanel" aria-labelledby="t-teams" tabindex="0" hidden></div>
  <div id="p-swaps" role="tabpanel" aria-labelledby="t-swaps" tabindex="0" hidden></div>

  <!-- Where the numbers come from: useful, but not what anyone opens the
       page for, so it sits after the content, closed. -->
  <details class="about-data card u-mt-6" id="about-data">
    <summary><span class="about-data__title">About these numbers</span>
      <span class="dim small">sources, coverage, and the other ways to slice them</span></summary>
    <div class="about-data__body">
      <div class="row u-mt-4">
        <a class="btn btn--sm btn--ghost" href="tiers.html">Hero tiers →</a>
        <a class="btn btn--sm btn--ghost" href="meta.html">Meta explorer →</a>
        <a class="btn btn--sm btn--ghost" href="series.html">Every series →</a>
      </div>
      <div id="coverage" class="u-mt-5"></div>
    </div>
  </details>

</main>
