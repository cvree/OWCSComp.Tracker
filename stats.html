<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats — OWCS Comp Tracker</title>
<meta name="description" content="Hero pick rates, map records, full compositions and confirmed mid-map swaps — every number counted only from line-ups a person has approved.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/owcs.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="shell shell--wide">

  <div class="page-head page-head--tight">
    <p class="eyebrow eyebrow--emerald">Approved data only</p>
    <h1>Stats</h1>
    <p class="lede">Everything on this page is counted from compositions a person has
      confirmed against the broadcast frame. Detections still waiting for review are not
      in these numbers — which is why the sample is small and honest rather than large
      and guessed.</p>
  </div>

  <div id="coverage" class="u-mt-5"></div>

  <div role="tablist" aria-label="Stats views" class="u-mt-6">
    <button role="tab" data-tab="heroes" aria-controls="p-heroes" id="t-heroes">Heroes</button>
    <button role="tab" data-tab="comps" aria-controls="p-comps" id="t-comps">Compositions</button>
    <button role="tab" data-tab="maps" aria-controls="p-maps" id="t-maps">Maps</button>
    <button role="tab" data-tab="teams" aria-controls="p-teams" id="t-teams">Teams</button>
    <button role="tab" data-tab="swaps" aria-controls="p-swaps" id="t-swaps">Swaps</button>
  </div>

  <div id="p-heroes" role="tabpanel" aria-labelledby="t-heroes" tabindex="0"></div>
  <div id="p-comps" role="tabpanel" aria-labelledby="t-comps" tabindex="0" hidden></div>
  <div id="p-maps" role="tabpanel" aria-labelledby="t-maps" tabindex="0" hidden></div>
  <div id="p-teams" role="tabpanel" aria-labelledby="t-teams" tabindex="0" hidden></div>
  <div id="p-swaps" role="tabpanel" aria-labelledby="t-swaps" tabindex="0" hidden></div>

</main>

<div class="lightbox" id="lightbox" hidden>
  <div data-close style="position:absolute;inset:0"></div>
  <figure class="lightbox__box" role="dialog" aria-modal="true" aria-label="Evidence frame" style="margin:0">
    <img id="lightbox-img" src="" alt="">
    <figcaption id="lightbox-cap"></figcaption>
    <div class="row u-mt-4"><button class="btn btn--sm" data-close>Close</button></div>
  </figure>
</div>

<script src="assets/vendor/lenis.min.js" defer></script>
<script src="assets/vendor/gsap.min.js" defer></script>
<script src="assets/vendor/ScrollTrigger.min.js" defer></script>
<script src="assets/js/app/motion.js" defer></script>
<script src="assets/data/hero_art.v1.js"></script>
<script src="assets/data/public_data.v1.js"></script>
<script src="assets/js/app/core.js"></script>
<script src="assets/js/app/games.js"></script>
<script src="assets/js/app/api.js"></script>
<script src="assets/js/app/evidence.js"></script>
<script src="assets/js/app/shell.js"></script>
<script src="assets/js/app/page-stats.js"></script>
</body>
</html>
