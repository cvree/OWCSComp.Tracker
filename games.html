<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games — OWCS Comp Tracker</title>
<meta name="description" content="Every Overwatch Champions Series game in the tracker: submitted, processing, waiting for review, or published with verified hero compositions.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/owcs.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="shell shell--wide">

  <div class="page-head page-head--tight">
    <p class="eyebrow eyebrow--lime">Everything, in one list</p>
    <h1>Games</h1>
    <p class="lede">One row per game, whatever state it is in — just submitted, being read,
      waiting for a person, or published. There is no separate list for “runs”, “sources” or
      “matches”; they were all the same thing.</p>
    <div class="row u-mt-5">
      <a class="btn btn--primary" href="submit.html">Submit a game</a>
    </div>
  </div>

  <div class="row u-mt-4" role="group" aria-label="Filter games by state">
    <div class="seg" id="state-filter"></div>
    <div class="spacer"></div>
    <label class="visually-hidden" for="q">Filter by team or event</label>
    <input class="input" id="q" type="search" placeholder="Filter by team or event…"
           style="max-width:280px" autocomplete="off">
  </div>

  <div id="games" class="u-mt-5" aria-live="polite"></div>

  <div id="upcoming" class="u-mt-6"></div>

</main>

<script src="assets/vendor/lenis.min.js" defer></script>
<script src="assets/vendor/gsap.min.js" defer></script>
<script src="assets/vendor/ScrollTrigger.min.js" defer></script>
<script src="assets/js/app/motion.js" defer></script>
<script src="assets/data/hero_art.v1.js"></script>
<script src="assets/data/public_data.v1.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app/core.js"></script>
<script src="assets/js/app/games.js"></script>
<script src="assets/js/app/api.js"></script>
<script src="assets/js/app/shell.js"></script>
<script src="assets/js/app/page-games.js"></script>
</body>
</html>
