# =====================================================================
# OWCS Comp Tracker — runner acquisition probe (read-only, $0, no secrets)
# ---------------------------------------------------------------------
# ONE question, answered honestly on the same free hardware the unattended
# pipeline would run on: can a GitHub-hosted runner resolve a direct media
# URL for an OWCS broadcast, and can remote_frames.py pull sparse frames
# out of it with byte-range reads?
#
# This decides whether the whole VOD -> published-comp loop can live on
# GitHub Actions, or whether media acquisition has to be brokered from
# somewhere YouTube will actually serve.
#
# The repo already knows that the per-video yt-dlp date lookup is refused
# here (YouTube bot-checks datacentre IPs), which is why the archive is
# dated through the Data API instead. But that path costs ONE player
# extraction per VIDEO; remote_frames costs ONE per SOURCE, and yt-dlp's
# alternate player clients are not all refused equally. Guessing is not
# evidence, so this measures it.
#
# Writes nothing, commits nothing, needs no secrets. Signed media URLs are
# never printed - only their host and length.
# =====================================================================
name: acquire-probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Broadcast URL to probe"
        required: false
        default: "https://www.youtube.com/live/jkSiX___Qwc"
      twitch_channel:
        description: "Official Twitch channel to probe for VODs"
        required: false
        default: "ow_esports"
  push:
    branches: [claude/auto-command-web-github-k8cpyg]
    paths: [".github/workflows/acquire-probe.yml"]

# The probe commits nothing, so it cannot race the data workflows — but it
# does make real requests to two broadcast platforms, and two probes running
# at once would ask them the same question twice for no extra evidence.
# Superseded runs are cancelled: the newest answer is the only one that
# matters, and there is no snapshot to lose.
concurrency:
  group: acquire-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip --quiet
          pip install --quiet yt-dlp
          echo "yt-dlp $(yt-dlp --version)"

      - name: YouTube — resolve a direct media URL (every player client)
        id: yt
        env:
          PROBE_URL: ${{ inputs.url || 'https://www.youtube.com/live/jkSiX___Qwc' }}
        run: |
          python - <<'PY' | tee resolve-youtube.log
          import os, subprocess, urllib.parse
          url = os.environ["PROBE_URL"]
          # One `-g` per client. The default web client is the one most
          # likely to be bot-checked; the others are what the fallback
          # ladder would reach for.
          clients = ["", "android", "ios", "tv", "mweb", "web_safari", "web_embedded"]
          fmt = "bv*[height<=720][ext=mp4]/bv*[height<=720]/best[height<=720]"
          winner = None
          for c in clients:
              cmd = ["yt-dlp", "-g", "-f", fmt, "--no-warnings", "--socket-timeout", "20"]
              if c:
                  cmd += ["--extractor-args", f"youtube:player_client={c}"]
              cmd.append(url)
              name = c or "default(web)"
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=180)
              except subprocess.TimeoutExpired:
                  print(f"{name:14s} TIMEOUT"); continue
              out = (p.stdout or "").strip().splitlines()
              if p.returncode == 0 and out and out[0].startswith("http"):
                  host = urllib.parse.urlparse(out[0]).netloc
                  print(f"{name:14s} OK    host={host} url_len={len(out[0])}")
                  winner = winner or name
              else:
                  err = " ".join((p.stderr or "").split())[:180]
                  print(f"{name:14s} FAIL  {err}")
          print(f"::notice::youtube: first working client: {winner or 'NONE'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"client={winner or ''}\n")
          PY

      # The same broadcasts are streamed on Twitch (config/broadcast_channels.json
      # records twitch.tv/OW_Esports as an official OWCS destination). Twitch has
      # no equivalent of YouTube's datacentre bot check, so if its VODs resolve
      # here, the whole acquisition step can stay on free GitHub hardware.
      - name: Twitch — list the official channel's VODs and resolve the newest
        id: tw
        env:
          TWITCH_CHANNEL: ${{ inputs.twitch_channel || 'ow_esports' }}
        run: |
          python - <<'PY' | tee resolve-twitch.log
          import os, json, subprocess, urllib.parse
          ch = os.environ["TWITCH_CHANNEL"]
          def run(cmd, timeout=180):
              try:
                  return subprocess.run(cmd, capture_output=True, text=True,
                                        timeout=timeout)
              except subprocess.TimeoutExpired:
                  return None
          listing = run(["yt-dlp", "-J", "--flat-playlist", "--playlist-end", "5",
                         "--no-warnings", f"https://www.twitch.tv/{ch}/videos"])
          vid = None
          if listing is None:
              print("listing        TIMEOUT")
          elif listing.returncode != 0:
              print("listing        FAIL  " + " ".join(
                  (listing.stderr or "").split())[:220])
          else:
              try:
                  data = json.loads(listing.stdout)
              except Exception as exc:
                  data = {}
                  print(f"listing        UNPARSEABLE {exc}")
              entries = data.get("entries") or []
              print(f"listing        OK    {len(entries)} recent VODs")
              for e in entries[:5]:
                  print(f"  - {str(e.get('title'))[:70]!r} "
                        f"dur={e.get('duration')} url={e.get('url')}")
              if entries:
                  vid = entries[0].get("url") or entries[0].get("id")
          if vid:
              if not str(vid).startswith("http"):
                  vid = f"https://www.twitch.tv/videos/{vid}"
              fmt = "bv*[height<=720]/best[height<=720]/best"
              p = run(["yt-dlp", "-g", "-f", fmt, "--no-warnings", vid])
              out = (p.stdout or "").strip().splitlines() if p else []
              if p and p.returncode == 0 and out and out[0].startswith("http"):
                  host = urllib.parse.urlparse(out[0]).netloc
                  print(f"resolve        OK    host={host} url_len={len(out[0])}")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                      fh.write(f"url={vid}\n")
              else:
                  err = " ".join(((p.stderr if p else "") or "").split())[:220]
                  print(f"resolve        FAIL  {err}")
          print("::notice::twitch probe complete")
          PY

      - name: Pull sparse frames with remote_frames.py (byte-range reads)
        if: steps.yt.outputs.client != '' || steps.tw.outputs.url != ''
        env:
          MEDIA_URL: ${{ steps.tw.outputs.url || inputs.url || 'https://www.youtube.com/live/jkSiX___Qwc' }}
        run: |
          pip install --quiet -r requirements.txt
          # Six frames a minute apart out of the middle of the broadcast:
          # the shape a calibration scan actually asks for.
          python pipeline/remote_frames.py --url "$MEDIA_URL" \
            --offsets 1900,1960,2020,2080,2140,2200 --height 720 --json \
            | tee frames.json
          echo "--- frames on disk ---"
          find work -name '*.png' -o -name '*.jpg' 2>/dev/null | head -20
          du -sh work 2>/dev/null || true

      # The finder's Twitch source, run against the real registry row on the
      # real channel. Offline tests prove the parsing and the dispatch; this
      # proves the source itself answers, and shows what it found.
      - name: Match finder — scan the official Twitch channel for real
        run: |
          python - <<'PY' | tee twitch-scan.log
          import sys
          sys.path.insert(0, "pipeline")
          from automation import config as cfg
          from automation import match_finder as mf
          from automation import link_intake as li

          rows = [c for c in cfg.load_channels(platform="twitch")]
          if not rows:
              print("no enabled Twitch channel in the registry"); raise SystemExit(0)
          ch = rows[0]
          print(f"channel: {ch['id']}  {ch['sourceUrl']}")
          entries, err = mf.fetch_twitch_vods(ch["sourceUrl"], limit=15)
          if err:
              print(f"::warning::twitch source error: {err}")
              raise SystemExit(0)
          cands = mf.merge_channel_entries(ch, [], entries, platform=li.TWITCH)
          print(f"{len(cands)} candidate(s) from {len(entries)} VOD(s)\n")
          for c in sorted(cands, key=lambda c: str(c.get("publishedAt")),
                          reverse=True)[:12]:
              lk = c.get("likeness") or {}
              hrs = (c.get("durationSeconds") or 0) / 3600.0
              print(f"  {str(c.get('publishedAt'))[:10]}  {hrs:5.1f}h  "
                    f"{lk.get('confidence','?'):8s}  {str(c.get('title'))[:64]}")
              print(f"      {c['url']}")
          # The handoff that matters: the URL discovery emits must be the
          # URL intake accepts.
          bad = [c["url"] for c in cands
                 if li.parse_link(c["url"])["videoId"] != c["videoId"]]
          print(f"\nround-trip through intake: "
                f"{'FAILED for ' + str(bad) if bad else 'all ' + str(len(cands)) + ' OK'}")
          PY

      - name: Report
        if: always()
        run: |
          {
            echo "### Runner acquisition probe"
            echo ""
            echo '```'
            echo "-- youtube --"
            cat resolve-youtube.log 2>/dev/null || echo "(no log)"
            echo "-- twitch --"
            cat resolve-twitch.log 2>/dev/null || echo "(no log)"
            echo "-- match finder, twitch source --"
            cat twitch-scan.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo ""
            if [ -s frames.json ]; then
              echo "Frame acquisition:"
              echo '```json'
              cat frames.json
              echo '```'
            else
              echo "No media URL resolved on this runner on EITHER source - frame acquisition not attempted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
