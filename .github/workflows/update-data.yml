# =====================================================================
# OWCS Comp Tracker — data update pipeline ($0, no secrets)
# ---------------------------------------------------------------------
# Ingests FACEIT rooms from data/sources/faceit_rooms.json, applies manual
# corrections, validates, exports assets/js/data.js, and commits it. The
# commit redeploys the static site (GitHub Pages / Cloudflare Pages).
#
# No paid services, no backend, no FACEIT API key. Uses only the default
# GITHUB_TOKEN to push the regenerated data file.
# =====================================================================
name: update-data

# MANUAL ONLY. Ingests FACEIT rooms + corrections and commits the
# regenerated data.js/DB. Kept off cron and off push triggers so it can
# never race the CI/Pages workflows or auto-mutate the committed
# milestone. Run it deliberately when you have new FACEIT rooms to ingest.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max FACEIT rooms to ingest this run"
        required: false
        default: ""

concurrency:
  group: owcs-generated-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # to dispatch pages.yml after a real commit (see below)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the DECLARED dependency set, not an ad-hoc subset. This step
      # used to `pip install opencv-python-headless` only, so any dependency
      # added to requirements.txt (or any version floor raised there) simply
      # would not exist on this runner — the run dies with ModuleNotFoundError
      # long after the "fresh install" was supposedly verified in ci.yml.
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run pipeline
        run: |
          ARGS="--no-sample"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python3 pipeline/run_batch.py $ARGS
          # Also refresh the PUBLIC dataset the live site renders from, so a
          # data update reaches fans, not just the control-room data.js.
          python3 pipeline/export_data.py --public

      - name: Sanity-check frontend JS (if node available)
        run: |
          if command -v node >/dev/null 2>&1; then
            node --check assets/js/app.js && echo "app.js OK"
          else
            echo "node not available; skipping app.js check"
          fi

      - name: Commit updated data.js (and DB) if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "owcs-pipeline[bot]"
          git config user.email "actions@users.noreply.github.com"
          for f in assets/js/data.js assets/data/public_data.v1.js data/owcs.sqlite; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No data changes this run."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: update from FACEIT + corrections ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # Bounded rebase-retry. A single `pull --rebase` + `push` loses this
          # run's regenerated data if ANY push lands in the window between the
          # two: the push is rejected, the job goes red, and the runner — which
          # holds the only copy of the export — is discarded.
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            echo "::warning::push attempt ${attempt} rejected (a concurrent push landed) — rebasing and retrying"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the data update after 3 rebase attempts"
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN deliberately does NOT
      # trigger other workflows (GitHub's anti-recursion safeguard on push
      # events), so without this step a data update would land on the branch
      # and pages.yml would never redeploy — the live site stays on whatever
      # a HUMAN last pushed. workflow_dispatch called via the API is exempt.
      - name: Trigger a Pages redeploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Data update summary"
            echo ""
            echo "- Matches in DB: $(python3 -c "import sys; sys.path.insert(0,'pipeline'); import db; print(db.connect().execute('SELECT COUNT(*) FROM matches').fetchone()[0])" 2>/dev/null || echo n/a)"
            echo "- FACEIT rooms configured: $(python3 -c "import json; print(len(json.load(open('data/sources/faceit_rooms.json')).get('rooms', [])))" 2>/dev/null || echo n/a)"
          } >> "$GITHUB_STEP_SUMMARY"
