# =====================================================================
# OWCS Comp Tracker — CI (offline test suite + packaging gate)
# ---------------------------------------------------------------------
# Runs the full deterministic, network-free test suite plus the
# packaging/reproducibility check on every push and PR. No secrets, no
# VOD download, no external services — everything the suite needs is in
# the repo (layouts, per-source templates, the SQLite milestone DB, the
# public export, and the committed evidence).
# =====================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One CI run per ref; cancel superseded runs so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system + Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Packaging / reproducibility check
        run: python pipeline/check_packaging.py

      # A REAL gate. This used to run the exporter and then
      # `git diff --stat … || true`, which can never fail — the step claimed
      # to enforce reproducibility while accepting any amount of drift.
      # Worse, regenerating in place left the working tree dirty, so
      # test_release_reproducibility's "the suite leaves the tree clean"
      # guard skipped itself (it skips when the tree is already dirty) on
      # every CI run. `--check` writes nothing and exits 1 on any difference
      # other than the generation timestamp.
      - name: Committed exports must match a fresh export (reproducibility)
        run: python pipeline/export_data.py --check --public

      # The site's discovery layer is derived from the committed scan, so a
      # hand-edit or a stale commit would make the pages render something no
      # scan ever produced. `--check` writes nothing and exits 1 on any
      # difference; the artifact carries no wall clock, so an unchanged scan
      # always rebuilds byte-identically.
      - name: Discovery layer must match a fresh build (self-fill)
        run: python pipeline/automation/cli.py self-fill --check

      - name: Offline test suite
        run: |
          fail=0
          for t in pipeline/test_*.py; do
            echo "::group::$t"
            if python "$t"; then
              echo "PASS $t"
            else
              echo "::error::FAIL $t"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Test summary
        if: always()
        run: |
          {
            echo "### CI summary"
            echo ""
            echo "- Suites: $(ls pipeline/test_*.py | wc -l)"
            echo "- Packaging check + export reproducibility gate + full"
            echo "  offline test suite ran on ubuntu-latest / Python 3.12."
          } >> "$GITHUB_STEP_SUMMARY"
