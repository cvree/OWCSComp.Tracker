# =====================================================================
# OWCS Comp Tracker — start times from Liquipedia (liquipedia)
# ---------------------------------------------------------------------
# The Matches page shows every series still to play. The community
# spreadsheet gives each one its round, format and order; it does not give
# a start time, and it reads TBD until its editors fill a card in. This job
# reads Liquipedia's OWCS pages (pipeline/liquipedia_schedule.py — the API
# terms it keeps are in config/liquipedia.json), writes
# data/external/liquipedia/matches.json, rebuilds the schedule export
# (pipeline/schedule_build.py), runs the schedule tests, and commits the two
# files back to the branch it ran on when they changed.
#
# Twice a day on match weeks is plenty: Liquipedia's editors fill a bracket
# in after each series, and the page converts every time to the viewer's
# own zone. A failed fetch commits nothing; the last good file stays.
#
# $0, no secrets beyond the default GITHUB_TOKEN.
# =====================================================================
name: liquipedia

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and print what Liquipedia lists, commit nothing"
        type: boolean
        default: false

concurrency:
  group: owcs-generated-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # dispatch pages.yml after publishing

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Dry run (prints, writes nothing)
        if: github.event.inputs.dry_run == 'true'
        run: python pipeline/liquipedia_schedule.py --dry-run

      - name: Fetch, rebuild, test
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          python pipeline/liquipedia_schedule.py
          python pipeline/schedule_build.py
          # The Home / Tiers export dates played series by Liquipedia's days too.
          python pipeline/sheet_sync.py rebuild
          python pipeline/sheet_sync.py check
          python pipeline/test_schedule.py

      # A red test means nothing is committed, and the runner (which holds
      # the only copy of the fresh fetch) is thrown away. Keep the fetch and
      # print what the schedule made of the events the tests pin, so the
      # failure can be read from the log alone.
      - name: Explain a failed rebuild
        if: failure() && github.event.inputs.dry_run != 'true'
        run: |
          python - <<'PY' || true
          import sys
          sys.path.insert(0, "pipeline")
          import schedule_build as SB
          doc = SB.read_js_object(SB.OUT) or {}
          for ev in ("korea/stage-3", "china/stage-3", "asia/stage-3"):
              ms = [m for m in doc.get("matches", []) if m.get("event") == ev and m.get("state") != "done"]
              print(f"== {ev}: {len(ms)} still to play")
              for m in ms:
                  print("  ", m.get("phase"), m.get("round"), m.get("bestOf"), m.get("date"),
                        m.get("dateFrom"), m.get("startsAt"), m.get("teamA"), m.get("teamB"), m.get("id"))
          PY
      - name: Keep the fetch
        if: failure() && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liquipedia-${{ github.run_id }}
          path: |
            data/external/liquipedia/
            assets/data/schedule.v1.js
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish
        id: publish
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/external/liquipedia assets/data/schedule.v1.js assets/data/sheet_tiers.v1.js)" ]; then
            echo "Schedule unchanged."; echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  "owcs-schedule[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/external/liquipedia assets/data/schedule.v1.js assets/data/sheet_tiers.v1.js
          git commit -m "schedule: Liquipedia start times ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          pushed=false
          for attempt in 1 2 3; do
            # The only files both data jobs write are generated exports
            # (schedule, tiers), rebuilt just below, so a clash on them
            # takes this commit's side instead of stopping the push.
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}"
            python pipeline/schedule_build.py
            python pipeline/sheet_sync.py rebuild
            git add assets/data/schedule.v1.js assets/data/sheet_tiers.v1.js
            git diff --cached --quiet || git commit -m "schedule: rebuild after rebase"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = "true" ] || { echo "::error::could not push"; exit 1; }
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.publish.outputs.committed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
