# =====================================================================
# OWCS Comp Tracker — community spreadsheet sync (external source)
# ---------------------------------------------------------------------
# Daily (and on demand) it downloads the PUBLIC xlsx export of the
# community-maintained OWCS spreadsheet — no Google API key, no secrets —
# and imports it as the separate external layer (pipeline/sheet_sync.py,
# docs/EXTERNAL-SHEET.md):
#
#   1. download the workbook and SHA-256 it;
#   2. identical to the last good import? stop — nothing is committed;
#   3. parse every tab, validate (a changed layout FAILS loudly), build the
#      source inventory and reconciliation reports;
#   4. run the exporter gates and the relevant offline test suites;
#   5. every gate green? commit the import straight to the branch it ran on
#      and redeploy Pages, so new results reach the Matches page without
#      anyone touching GitHub. (It used to stop at a review pull request on
#      auto/sheet-sync, which meant the site only moved when a person
#      remembered to merge it.) Set the repository variable
#      SHEET_SYNC_REVIEW=true to get the review-PR behaviour back.
#
# On failure (download refused, not an xlsx, layout changed, any gate or
# test red) nothing is committed — the last good import stays live — and the
# failure report is put in the job summary and uploaded as an artifact.
#
# The review pull request (review mode only) is opened with BOT_PAT when
# that secret exists (so ci.yml runs on it), else with GITHUB_TOKEN.
# =====================================================================
name: sheet-sync

on:
  schedule:
    # Every 6 hours at :41 — OWCS regions play across every time zone, so
    # there is no quiet hour; off the top of the hour to dodge the runner
    # crush. GitHub delays and sometimes drops scheduled runs, so a single
    # daily slot could leave results a day or two behind. An unchanged
    # workbook stops at the hash check and commits nothing.
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-import even if the workbook hash is unchanged"
        type: boolean
        default: false
      accept_structure_change:
        description: "Accept a reviewed tab rename/removal (otherwise it fails)"
        type: boolean
        default: false
      probe:
        description: "Only print what the workbook contains (tabs, first rows, images) to the log — imports nothing"
        type: boolean
        default: false
      probe_dump:
        description: "With probe: ranges to print cell by cell, e.g. Japan - Stage 1!A1:CR27"
        type: string
        default: ""
      inventory:
        description: "Only parse the workbook and print the inventory, Self-Check comparison, a sample of parsed maps and the reconciliation summary to the log — writes and commits nothing"
        type: boolean
        default: false
      inventory_sample:
        description: "With inventory: how many parsed maps to print per tab"
        type: string
        default: "4"

# Every workflow that commits generated data shares ONE group so they
# serialise (test_release_reproducibility / test_discovery_workflow).
concurrency:
  group: owcs-generated-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatch pages.yml after publishing
  issues: write    # the failure alert (.github/scripts/sync-alert.sh)

jobs:
  sync:
    runs-on: ubuntu-latest
    # A large workbook (the real one is over 50 MB) takes minutes to export
    # on Google's side and to parse here.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Probe the workbook (read-only, prints to this log)
        if: github.event.inputs.probe == 'true'
        env:
          PROBE_DUMP: ${{ github.event.inputs.probe_dump }}
        run: |
          if [ -n "$PROBE_DUMP" ]; then
            python pipeline/sheet_sync.py probe --download --dump "$PROBE_DUMP"
          else
            python pipeline/sheet_sync.py probe --download --rows 40
          fi

      - name: Parse inventory (read-only, prints to this log)
        if: github.event.inputs.inventory == 'true' && github.event.inputs.probe != 'true'
        env:
          SAMPLE: ${{ github.event.inputs.inventory_sample }}
        run: |
          python pipeline/sheet_sync.py inventory --download --sample "${SAMPLE:-4}" | tee inventory.md
          {
            echo "## Spreadsheet parse inventory (nothing written)"
            echo
            sed -n '1,80p' inventory.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download, compare hash, import, reconcile
        if: github.event.inputs.probe != 'true' && github.event.inputs.inventory != 'true'
        id: sync
        run: |
          # Where this import started: the Discord post lists the series
          # that are new since this commit.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          args=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then args="$args --force"; fi
          if [ "${{ github.event.inputs.accept_structure_change }}" = "true" ]; then
            args="$args --accept-structure-change"; fi
          set +e
          python pipeline/sheet_sync.py sync $args 2>&1 | tee sync.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            {
              echo "## Spreadsheet sync FAILED — the last good import is still live"
              echo
              cat reports/external/gsheet/last_failure.md 2>/dev/null || cat sync.log
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The season schedule (Matches page) is built from the same import.
          python pipeline/schedule_build.py
          if git status --porcelain -- data/external reports/external assets/data/schedule.v1.js assets/data/external_sheet.v1.js assets/data/external_summary.v1.js assets/data/external_series.v1.js assets/data/sheet_tiers.v1.js assets/data/external_sheet | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Workbook unchanged since the last import — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the failure report and the downloaded workbook
        if: always() && github.event.inputs.probe != 'true' && github.event.inputs.inventory != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sheet-sync-${{ github.run_id }}
          path: |
            sync.log
            reports/external/gsheet/
            work/gsheet/*.xlsx
            reports/external/gsheet/last_failure.*
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail the run when the sync failed
        if: github.event.inputs.probe != 'true' && github.event.inputs.inventory != 'true' && steps.sync.outputs.exit != '0'
        run: |
          echo "::error::Spreadsheet sync failed; nothing was committed. See the job summary."
          exit 1

      # The gates decide whether the DATA is sound. A check that only pins
      # what the live season looked like when it was written is a warning
      # here, not a stop (OWCS_DATA_RUN, see test_schedule.py): those blocked
      # every import for days, twice. Warnings are published with the
      # import and raised as an alert below.
      - name: Gates and offline tests
        if: steps.sync.outputs.changed == 'true'
        env:
          OWCS_DATA_RUN: "1"
          OWCS_GATE_WARNINGS: gate_warnings.md
        run: |
          set -o pipefail
          exec > >(tee gate.log) 2>&1
          python pipeline/sheet_sync.py check
          python pipeline/export_data.py --check --public
          python pipeline/test_external_sheet.py
          python pipeline/test_external_summary.py
          python pipeline/test_time_weighting.py
          python pipeline/test_meta_stats_js.py
          python pipeline/test_tier_stats.py
          python pipeline/test_schedule.py
          python pipeline/test_public_export_contracts.py
          python pipeline/test_site.py

      - name: Publish the import
        id: publish
        if: steps.sync.outputs.changed == 'true' && vars.SHEET_SYNC_REVIEW != 'true'
        run: |
          set -euo pipefail
          git config user.name  "owcs-sheet-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          PATHS=(data/external reports/external assets/data/external_sheet.v1.js assets/data/external_summary.v1.js assets/data/external_series.v1.js assets/data/sheet_tiers.v1.js assets/data/schedule.v1.js)
          git add -A "${PATHS[@]}"
          if [ -d assets/data/external_sheet ]; then git add -A assets/data/external_sheet; fi
          SHA=$(python -c "import json;print(json.load(open('data/external/gsheet/manifest.json'))['lastGood'][:12])")
          git commit -m "data: community spreadsheet import (workbook $SHA)"
          # Bounded rebase-retry, as the other data workflows do. The schedule
          # and the tiers export also read Liquipedia's file (the day each
          # played series was played), so rebuild both after each rebase in
          # case the liquipedia job landed in between.
          pushed=false
          for attempt in 1 2 3; do
            # The only files both data jobs write are generated exports
            # (schedule, tiers), rebuilt just below, so a clash on them
            # takes this commit's side instead of stopping the push.
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}"
            python pipeline/sheet_sync.py rebuild
            python pipeline/schedule_build.py
            git add assets/data/schedule.v1.js assets/data/sheet_tiers.v1.js
            git diff --cached --quiet || git commit -m "schedule: rebuild after rebase"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            echo "::warning::push attempt ${attempt} rejected — rebasing and retrying"
            sleep $((attempt * 5))
          done
          [ "$pushed" = "true" ] || { echo "::error::could not push the spreadsheet import"; exit 1; }
          echo "committed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Spreadsheet import published (workbook \`$SHA\`)"
            echo
            sed -n '1,14p' reports/external/gsheet/inventory.md
          } >> "$GITHUB_STEP_SUMMARY"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so
      # Pages has to be asked explicitly or the commit never reaches the site.
      - name: Redeploy the site
        if: steps.publish.outputs.committed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      # ---- telling people -------------------------------------------------
      # New results and the meta since the patch, to Discord. Only from main
      # (what the site shows) and only when DISCORD_WEBHOOK_URL is set.
      - name: Post the new results to Discord
        if: steps.publish.outputs.committed == 'true' && github.ref_name == 'main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python pipeline/discord_notify.py results --base "${{ steps.sync.outputs.base }}"

      - name: Raise checks that no longer hold on the new data
        if: steps.publish.outputs.committed == 'true' && hashFiles('gate_warnings.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: |
          {
            echo "The import was **published** — the site is up to date. These checks describe"
            echo "the season as it was when they were written and are no longer true of the"
            echo "new data. Update or retire them (they would fail the next code change's CI):"
            echo
            cat gate_warnings.md
          } > alert.md
          .github/scripts/sync-alert.sh open "Spreadsheet sync: checks out of date with the live season" alert.md

      - name: Alert on failure
        if: failure() && github.event.inputs.probe != 'true' && github.event.inputs.inventory != 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: |
          {
            echo "The spreadsheet sync failed, so **new results are not reaching the site**."
            echo "The last good import is still live. It retries every 6 hours; this issue"
            echo "closes itself when a run succeeds."
            echo
            if [ "${{ steps.sync.outputs.exit }}" != "0" ] && [ -f reports/external/gsheet/last_failure.md ]; then
              echo "**Import failed:**"; echo; head -c 3000 reports/external/gsheet/last_failure.md
            elif grep -q "FAIL\|Error\|error" gate.log 2>/dev/null; then
              echo "**The import was fine; a gate rejected it:**"; echo; echo '```'
              grep -n "FAIL\|FAILED\|Error\|error\|Traceback" gate.log | head -40; echo '```'
            else
              echo "No report was written — read the run log."
            fi
          } > alert.md
          .github/scripts/sync-alert.sh open "Spreadsheet sync is failing" alert.md

      - name: Clear the failure alert
        if: success() && github.event.inputs.probe != 'true' && github.event.inputs.inventory != 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/sync-alert.sh close "Spreadsheet sync is failing" "The sync succeeded."

      - name: Open or update the review pull request
        if: steps.sync.outputs.changed == 'true' && vars.SHEET_SYNC_REVIEW == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BR="auto/sheet-sync"
          git config user.name  "owcs-sheet-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BR"
          # -A also stages deletions (a tab or detail shard that no longer exists).
          git add -A data/external reports/external assets/data/external_sheet.v1.js assets/data/external_summary.v1.js assets/data/external_series.v1.js assets/data/sheet_tiers.v1.js assets/data/schedule.v1.js
          if [ -d assets/data/external_sheet ]; then git add -A assets/data/external_sheet; fi
          SHA=$(python -c "import json;print(json.load(open('data/external/gsheet/manifest.json'))['lastGood'][:12])")
          git commit -m "data: community spreadsheet import (workbook $SHA)"
          git push --force origin "$BR"

          {
            echo "Automated import of the community OWCS spreadsheet (workbook \`$SHA\`)."
            echo
            echo "Spreadsheet observations stay a separate, labelled source — nothing here changes"
            echo "VOD-verified data. Review the inventory and reconciliation below, then merge."
            echo
            sed -n '1,40p' reports/external/gsheet/inventory.md
            echo
            sed -n '1,60p' reports/external/gsheet/reconciliation.md
            echo
            echo "_Generated by the sheet-sync workflow._"
          } > pr-body.md

          if gh pr view "$BR" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BR" --body-file pr-body.md --title "Spreadsheet import: workbook $SHA"
            echo "Updated the open review PR for $BR."
          elif gh pr create --base "${GITHUB_REF_NAME}" --head "$BR" \
              --title "Spreadsheet import: workbook $SHA" --body-file pr-body.md; then
            echo "Opened a review PR for $BR."
          else
            echo "::error::Could not open a pull request for $BR — the branch was pushed; open it by hand."
            exit 1
          fi
          {
            echo "## Spreadsheet import ready for review"
            echo
            sed -n '1,14p' reports/external/gsheet/inventory.md
          } >> "$GITHUB_STEP_SUMMARY"
