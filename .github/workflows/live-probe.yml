# =====================================================================
# OWCS Comp Tracker — every map, ready to watch (live-probe)
# ---------------------------------------------------------------------
# Runs pipeline/live_ingest.py against one broadcast on a free runner:
# samples the whole broadcast remotely, classifies every sample with the
# layout's gameplay filter, splits the live play into map windows, and names
# each window's map, game number and teams from the HUD text
# (live_identity.py) — without downloading the broadcast.
#
# The result is published: data/broadcast_maps/<video id>.json plus the
# site's assets/data/broadcast_maps.v1.js, so every game page carries
# "▶ Watch" links that open the VOD at the second each map starts.
#
# Daily, with no input, it indexes the newest broadcast that has none yet
# (pipeline/broadcast_maps.py --next: Twitch originals of events whose HUD
# has measured identity zones). Dispatch it with a URL to index one by hand;
# tick keep_frames to also push four frames per map to a scratch branch
# `probe/<video id>` for inspection.
# =====================================================================
name: live-probe

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Broadcast URL (Twitch); empty = the next unindexed one"
        required: false
        default: ""
      layout:
        description: "Layout id (ignored when the URL is picked automatically)"
        required: false
        default: "owcs_8c105lnzlam"
      step:
        description: "Seconds between timeline samples"
        required: false
        default: "30"
      keep_frames:
        description: "Also push four frames per map to probe/<video id>"
        type: boolean
        default: false

# It pushes, so it queues with every other repo-writing workflow rather
# than racing one.
concurrency:
  group: owcs-generated-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # dispatch pages.yml after publishing

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Which broadcast
        id: which
        env:
          URL: ${{ inputs.url }}
          LAYOUT: ${{ inputs.layout || 'owcs_8c105lnzlam' }}
        run: |
          if [ -n "$URL" ]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "layout=$LAYOUT" >> "$GITHUB_OUTPUT"
          else
            read -r url layout < <(python3 pipeline/broadcast_maps.py --next || true)
            echo "url=${url:-}" >> "$GITHUB_OUTPUT"; echo "layout=${layout:-}" >> "$GITHUB_OUTPUT"
          fi
          echo "broadcast: ${URL:-${url:-none left to index}}"

      - name: Install dependencies
        if: steps.which.outputs.url != ''
        run: |
          # tesseract reads the map, game and team names off the HUD strip
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt pytesseract

      - name: Find and name the maps
        if: steps.which.outputs.url != ''
        env:
          URL: ${{ steps.which.outputs.url }}
          LAYOUT: ${{ steps.which.outputs.layout }}
          STEP: ${{ inputs.step || '30' }}
        run: |
          set -o pipefail
          python pipeline/live_ingest.py --url "$URL" --layout "layouts/$LAYOUT.json" \
            --out probe --step "$STEP" 2>&1 | tee probe.log

      - name: Publish the map index and its teams
        id: publish
        if: steps.which.outputs.url != ''
        shell: bash
        env:
          URL: ${{ steps.which.outputs.url }}
        run: |
          set -euo pipefail
          python pipeline/broadcast_maps.py --from-timeline probe/timeline.json
          # every team the broadcast named becomes a team, with the logo cut
          # from the HUD (the frames are still cached on this runner)
          python pipeline/broadcast_teams.py --timeline probe/timeline.json --url "$URL"
          python pipeline/broadcast_maps.py --index
          python pipeline/broadcast_maps.py --index --check
          if [ -n "$(git status --porcelain data/owcs.sqlite)" ]; then
            python pipeline/export_data.py --public
            python pipeline/export_data.py --check --public
            python pipeline/build_asset_manifest.py
            python pipeline/test_assets.py
          fi
          python pipeline/test_live_identity.py
          python pipeline/test_broadcast_teams.py
          git config user.name  "owcs-live-probe[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/broadcast_maps assets/data/broadcast_maps.v1.js data/owcs.sqlite \
            assets/img/teams assets/data/public_data.v1.js assets/js/data.js \
            assets/data/asset_manifest.json assets/data/team_asset_sources.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          vid=$(python3 -c "import json; print(json.load(open('probe/timeline.json'))['url'].rstrip('/').split('/')[-1])")
          git commit -m "broadcast maps: index $vid"
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = "true" ] || { echo "::error::could not push"; exit 1; }
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Keep four frames from each map
        if: steps.which.outputs.url != '' && inputs.keep_frames
        env:
          URL: ${{ steps.which.outputs.url }}
        run: |
          python - <<'PY'
          import json, os, shutil, sys
          sys.path.insert(0, "pipeline")
          import remote_frames as rf
          t = json.load(open("probe/timeline.json", encoding="utf-8"))
          src = rf.RemoteFrameSource(os.environ["URL"], height=720)
          os.makedirs("probe/frames", exist_ok=True)
          for m in t["maps"]:
              span = m["end"] - m["start"]
              offs = [round(m["start"] + span * f, 1) for f in (0.08, 0.35, 0.65, 0.92)]
              got = src.grab(offs)
              for o in offs:
                  if got.get(o):
                      shutil.copy(got[o], f"probe/frames/map{m['index']:02d}_t{int(o):06d}.jpg")
          print(len(os.listdir("probe/frames")), "frames kept")
          PY

      - name: Push frames to a scratch branch
        if: steps.which.outputs.url != '' && inputs.keep_frames
        env:
          URL: ${{ steps.which.outputs.url }}
        run: |
          set -euo pipefail
          vid=$(python3 -c "import os,sys; sys.path.insert(0,'pipeline'); from automation import link_intake as li; print(li.parse_link(os.environ['URL'])['videoId'])")
          cp probe.log probe/
          git checkout --orphan "probe/$vid"
          git rm -rq --cached . >/dev/null
          git add -f probe
          git commit -qm "probe: map windows for $vid"
          git push -f origin "probe/$vid"
          echo "::notice::pushed probe/$vid"

      - name: Report
        if: always()
        run: |
          {
            echo "### Map windows"
            echo '```'
            grep -E "map window|^\[live-ingest\] #" probe.log 2>/dev/null || echo "(no broadcast probed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
