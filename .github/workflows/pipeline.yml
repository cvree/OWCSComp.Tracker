# =====================================================================
# OWCS Comp Tracker — scheduled pipeline
# ---------------------------------------------------------------------
# Chains: init_db → run_batch (capture → detect → map_sync per match)
#         → export_data, then commits data/owcs.sqlite + assets/js/data.js.
# The commit redeploys the static site (GitHub Pages from branch, or
# Cloudflare Pages watching the repo).
#
# $0 by design: public-repo Actions minutes, no server, no secrets
# beyond the default GITHUB_TOKEN.
#
# Before the first useful run you must commit, for the broadcast package
# being processed:
#   - layouts/<your-layout>.json  — a CALIBRATED profile (real hud_probe chip
#     geometry from pipeline/calibrate_source.py), not the placeholder starter
#   - templates/<package>/<hero_id>.png — that package's own hero templates
#     (check coverage with pipeline/template_bootstrap.py --all-layouts;
#     uncovered heroes are reported UNKNOWN, never guessed)
# Until then, runs are graceful no-ops.
# =====================================================================

name: pipeline

# MANUAL ONLY. This capture->detect->export batch pushes commits back to
# the repo and depends on a calibrated layout + templates for the target
# broadcast. It is intentionally NOT on a cron: an unattended scheduled
# run on a fresh clone would try to mutate the committed milestone DB and
# push, and would fail without a matching layout. Run it deliberately via
# "Run workflow" once you have calibrated a layout for pending matches.
on:
  workflow_dispatch:
    inputs:
      layout:
        description: "Calibrated layout json to process with"
        required: false
        # owcs_jksix_qwc is the only CALIBRATED, verified broadcast package in
        # the repo (real chip geometry + a per-source template set + a
        # calibration sheet). The previous default, owcs_youtube_2026, is an
        # explicitly-labelled PLACEHOLDER whose rectangles are guesses and
        # which carries no hud_probe — dispatching with it produced garbage
        # slot reads rather than an honest failure.
        default: "layouts/owcs_jksix_qwc.json"
      match_id:
        description: "Process only this match id (debugging)"
        required: false
        default: ""
      max_vods:
        description: "Max VODs to process this run"
        required: false
        default: "2"

# Every workflow that mutates the SAME generated files — data/owcs.sqlite,
# assets/js/data.js, assets/data/public_data.v1.js — shares ONE concurrency
# group. Previously each had its own group, so `discovery`, `pipeline` and
# `update-data` could run simultaneously and race on those files: two runs
# would export from different DB states and the second commit would silently
# clobber the first. Queue instead of cancel, so a manual run still happens
# after a scheduled one rather than being dropped.
concurrency:
  group: owcs-generated-data
  cancel-in-progress: false

permissions:
  contents: write   # commit the updated DB + data.js
  actions: write    # dispatch pages.yml after a real commit (see below)

env:
  # Chosen at dispatch time; defaults to the one CALIBRATED, verified package.
  LAYOUT: ${{ github.event.inputs.layout || 'layouts/owcs_jksix_qwc.json' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # hard stop well inside free limits

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install the DECLARED dependency set (plus ffmpeg, a system package
      # requirements.txt cannot provide). Naming a hand-picked subset here
      # meant anything later added to requirements.txt was simply absent on
      # this runner, surfacing as a ModuleNotFoundError mid-batch.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet -r requirements.txt

      - name: Init / migrate database
        run: python3 pipeline/init_db.py   # idempotent: schema + reference seed

      # Future Section-2 hook — uncomment when the results ingest exists:
      # - name: Ingest schedules & results
      #   run: python3 pipeline/ingest.py --region asia

      - name: Apply manual comp corrections
        run: python3 pipeline/apply_corrections.py

      # validate_data.py itself already distinguishes WARNINGS (exit 0) from
      # hard referential-integrity ERRORS (exit 1) — see its own docstring.
      # This step used to swallow that with `|| echo ...`, so a hard error
      # was reported but never actually blocked the run: run_batch/export
      # kept going and committed on top of broken data. No `|| ...` here:
      # a hard error now fails this step, fails the job, and nothing gets
      # published.
      - name: Validate data quality (hard errors block publishing)
        run: python3 pipeline/validate_data.py

      - name: Run pipeline batch
        run: |
          ARGS="--layout $LAYOUT --max ${{ github.event.inputs.max_vods || '2' }}"
          if [ -n "${{ github.event.inputs.match_id }}" ]; then
            ARGS="$ARGS --match ${{ github.event.inputs.match_id }}"
          fi
          python3 pipeline/run_batch.py $ARGS
          # run_batch only writes the control-room export (assets/js/data.js).
          # Without this the PUBLIC dataset the live site actually renders
          # (assets/data/public_data.v1.js) is never refreshed, so a pipeline
          # run updates the DB and the site shows the old comps — and the
          # committed public export now disagrees with the committed DB, which
          # ci.yml's reproducibility gate reports as drift on the next push.
          python3 pipeline/export_data.py --public

      - name: Upload quarantined frames (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-${{ github.run_id }}
          path: work/*/quarantine/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "owcs-pipeline[bot]"
          git config user.email "actions@users.noreply.github.com"
          # TIMESTAMP-ONLY GUARD: export_data.py stamps every export with the
          # moment it ran even when the underlying comps/stats are identical
          # to what's already committed. A raw `git diff --cached --quiet`
          # can't tell that apart from a real change and would push a
          # no-op commit (and redeploy Pages for nothing) every run.
          if ! python3 pipeline/automation/meaningful_diff.py \
              data/owcs.sqlite assets/js/data.js assets/data/public_data.v1.js; then
            echo "No data changes this run (only generation timestamps moved)."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add data/owcs.sqlite assets/js/data.js assets/data/public_data.v1.js
          if git diff --cached --quiet; then
            echo "No data changes this run."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "pipeline: update comps & stats ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # Bounded rebase-retry: a single pull+push loses this run's work if
          # any push lands in the window between them (rejected push -> red
          # job -> the runner holding the only copy of the batch output is
          # discarded, and the VOD has to be reprocessed from scratch).
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            echo "::warning::push attempt ${attempt} rejected (a concurrent push landed) — rebasing and retrying"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the pipeline update after 3 rebase attempts"
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push does not trigger push-event workflows, so without
      # this the refreshed public dataset would sit on the branch and the
      # Pages site would keep serving the previous export indefinitely.
      - name: Trigger a Pages redeploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Pipeline run summary"
            echo ""
            # `|| echo n/a` on a SUMMARY line only. This step is if: always(),
            # so on a run that died before init_db these queries raise; without
            # the fallback the summary step itself goes red and buries the
            # actual failure under a second, meaningless one.
            echo "- Matches in DB: $(python3 -c "import sys; sys.path.insert(0,'pipeline'); import db; print(db.connect().execute('SELECT COUNT(*) FROM matches').fetchone()[0])" 2>/dev/null || echo n/a)"
            echo "- Comp snapshots: $(python3 -c "import sys; sys.path.insert(0,'pipeline'); import db; print(db.connect().execute('SELECT COUNT(*) FROM comp_snapshots').fetchone()[0])" 2>/dev/null || echo n/a)"
            echo "- Unassigned snapshots: $(python3 -c "import sys; sys.path.insert(0,'pipeline'); import db; print(db.connect().execute('SELECT COUNT(*) FROM comp_snapshots WHERE map_result_id IS NULL').fetchone()[0])" 2>/dev/null || echo n/a)"
            q=$(find work -type d -name quarantine 2>/dev/null | wc -l)
            echo "- Matches with quarantined frames this run: $q"
          } >> "$GITHUB_STEP_SUMMARY"
