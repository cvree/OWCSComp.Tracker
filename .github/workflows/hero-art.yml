# =====================================================================
# OWCS Comp Tracker — every hero gets their picture (hero-art)
# ---------------------------------------------------------------------
# Fetches Blizzard's official art for any hero in the roster that has
# none committed yet (pipeline/build_hero_official_assets.py --missing),
# re-derives the portrait / icon / card crops, rebuilds the art index and
# the asset manifest, runs the asset tests, and commits the result back to
# the branch it ran on.
#
# Runs on its own when a new hero is added (a push that touches the fetcher
# or this file), once a week as a safety net, and on demand. A hero whose
# page has no image named for them is left on the designed monogram and
# the job log lists the image names the page did carry, so a person can add
# a codename to KNOWN_CODENAMES — nothing is ever guessed.
#
# $0, no secrets beyond the default GITHUB_TOKEN.
# =====================================================================
name: hero-art

on:
  push:
    paths:
      - ".github/workflows/hero-art.yml"
      - "pipeline/build_hero_official_assets.py"
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:
    inputs:
      hero:
        description: "Optional single hero id to (re)fetch, e.g. dmon"
        required: false
        default: ""

concurrency:
  group: owcs-generated-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # dispatch pages.yml after publishing

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Fetch missing hero art
        env:
          HERO: ${{ inputs.hero }}
        run: |
          set -euo pipefail
          if [ -n "${HERO:-}" ]; then
            python pipeline/build_hero_official_assets.py --hero-id "$HERO" --force
          else
            python pipeline/build_hero_official_assets.py --missing
          fi

      - name: Publish
        id: publish
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain assets/img/heroes/official)" ]; then
            echo "No new hero art."; echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python pipeline/build_hero_art_index.py
          python pipeline/build_asset_manifest.py
          python pipeline/test_assets.py
          python -m unittest pipeline/test_hero_official_assets.py
          git config user.name  "owcs-hero-art[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img/heroes/official assets/data/hero_art.v1.js assets/data/asset_manifest.json
          added=$(git diff --cached --name-only -- 'assets/img/heroes/official/*/artwork.jpg' \
            | sed -E 's#.*/official/([^/]+)/.*#\1#' | sort -u | paste -sd, -)
          git commit -m "hero art: ${added:-refreshed}"
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = "true" ] || { echo "::error::could not push"; exit 1; }
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.publish.outputs.committed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
