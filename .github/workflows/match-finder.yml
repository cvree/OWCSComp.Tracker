# =====================================================================
# OWCS Comp Tracker — auto match finder ($0, no secrets, no API key)
# ---------------------------------------------------------------------
# Scans every VERIFIED broadcast channel for OWCS broadcasts on two
# permanently free sources and commits TWO artifacts:
#
#   assets/data/matchfinder.v1.json  the raw scan (the portal's snapshot)
#   assets/data/discovered.v1.js     the layer the PUBLIC pages render
#                                    (pipeline/automation/self_fill.py)
#
# The second one is what makes this workflow visible to a visitor. The
# snapshot alone was rendered only by the operator's own localhost portal,
# so for a long time the scan committed real broadcasts every six hours
# and the live site kept showing whatever a human last pushed. self_fill
# turns that scan into the games list, the dashboard's "filling itself"
# band and the per-broadcast page — derived in the SAME command, so the
# site can never render a scan that no longer exists.
#
# The scan also gives previously dateless archived broadcasts their real air
# date. The /streams tab is dumped with --flat-playlist, which is one cheap
# request for a whole channel but frequently omits the timestamp, and a
# broadcast with no date can never be placed on the calendar.
#
# That backfill takes whichever of two paths is available:
#
#   * YOUTUBE_API_KEY set (the case here) — videos.list returns FIFTY videos
#     per call for ONE quota unit, so the entire dateless archive costs a
#     handful of units against the 10,000/day default. It also returns
#     liveStreamingDetails.actualStartTime, which for an archived broadcast
#     is the real air date rather than a publish timestamp.
#   * No key — the bounded per-video yt-dlp lookup (--fill-dates), which
#     still works from a residential IP but is currently REFUSED on
#     GitHub-hosted runners: YouTube bot-checks datacentre IPs and asks for
#     cookies, which an unattended public scan has no business holding. It
#     keeps its budget and its circuit breaker for that reason.
#
# The key buys dates and nothing else. Without it this workflow still runs
# end to end with no secrets at all, exactly as it did before.
#
# The two sources (see pipeline/automation/match_finder.py):
#   * the channel's public RSS feed (stdlib urllib; no key, no quota)
#   * the channel's /streams tab via `yt-dlp --flat-playlist` (metadata
#     only — the `-J` dump, never a media download)
#
# Cost: $0. No FACEIT key, no cookies, no login. YOUTUBE_API_KEY is used
# when present — free tier, ~5 of 10,000 daily units for the whole
# archive — and the run degrades to the keyless path when it is not.
# GitHub-hosted runners can reach YouTube's public feeds and channel
# listings, which is the whole reason this runs here (its per-video player
# API is a different story — see the backfill note above): the finder is
# the one part of the system that needs real
# egress, and a scheduled runner provides it for free.
#
# Safety — this workflow CANNOT publish a composition:
#   * `find-matches` never downloads video, never runs detection, never
#     writes a hero comp, and never approves a source. It writes exactly
#     two artifacts: the ledger (gitignored) and the public snapshot.
#   * --queue-likely is deliberately NOT used here. Registering intake
#     jobs is an operator action against the operator's own job DB (which
#     is gitignored runtime state and does not exist on a runner), so
#     doing it in CI would write jobs nowhere and imply approval this
#     workflow has no business granting.
#   * Only assets/data/matchfinder.v1.json is ever staged, so a scan can
#     never touch the DB, the public dataset, or a layout.
#   * The snapshot carries public broadcast metadata only (video ids,
#     titles, channel ids, durations, likeness verdicts + reasons). A test
#     asserts no credential-shaped key can appear in it.
# =====================================================================
name: match-finder

on:
  schedule:
    # Every 6 hours at :43 — OWCS broadcasts land in bursts on match days
    # and a VOD stays findable indefinitely, so polling harder buys
    # nothing. Off the top of the hour to dodge runner congestion.
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max videos per channel from the streams tab"
        required: false
        default: "60"
      dry_run:
        description: "Scan and report without committing (true|false)"
        required: false
        default: "false"
      fill_dates:
        description: "Max metadata-only lookups spent giving dateless archived broadcasts their real air date"
        required: false
        default: "15"

# Shares the ONE generated-data group with discovery/pipeline/update-data:
# all four commit to the same branch, and separate groups are exactly how
# two runs end up clobbering each other's commits.
concurrency:
  group: owcs-generated-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # to dispatch pages.yml after a real commit (see below)

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIMIT: ${{ github.event.inputs.limit || '60' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      FILL_DATES: ${{ github.event.inputs.fill_dates || '15' }}
      # Read-only, metadata-only, and optional. When absent the scan falls
      # back to the bounded yt-dlp lookup and says so in its own output.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The finder is stdlib-only for RSS; yt-dlp is what reads the
      # /streams tab. No opencv, no ffmpeg — nothing here decodes video.
      - name: Install yt-dlp
        run: python3 -m pip install --upgrade yt-dlp

      # `set -euo pipefail` + a non-empty report assertion, for the same
      # reason discovery.yml does it: a `python3 ... | tee` pipeline lets
      # tee's zero exit hide a failing python3, which is how a workflow
      # reports green with an empty artifact.
      - name: Scan verified channels for OWCS broadcasts
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--limit "$LIMIT" --fill-dates "$FILL_DATES")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python3 pipeline/automation/cli.py find-matches "${ARGS[@]}" 2>&1 | tee run-output.txt
          test -s run-output.txt

      # The finder reports a dead source as data rather than crashing, so a
      # green scan step does NOT by itself mean both sources worked. Surface
      # that explicitly instead of letting a silently-empty result look like
      # "no broadcasts exist".
      - name: Report source health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          with open("assets/data/matchfinder.v1.json", encoding="utf-8") as f:
              r = json.load(f)
          s = r.get("summary") or {}
          errs = r.get("sourceErrors") or []
          print("### Auto match finder")
          print()
          print(f"- Candidates known: **{s.get('total', 0)}**")
          print(f"- Likely broadcasts: **{s.get('likely', 0)}**")
          print(f"- Channels scanned: {len(r.get('channels') or [])}")
          print(f"- Last scan: {r.get('generatedAt')}")
          # What the SITE will actually show, which is the point of the run.
          try:
              with open("assets/data/discovered.v1.js", encoding="utf-8") as f:
                  text = f.read()
              body = json.loads(text[text.index("{"):text.rstrip().rstrip(";").rindex("}") + 1])
              d = body.get("summary") or {}
              print(f"- Site discovery layer: **{d.get('broadcastsKnown', 0)}** "
                    f"broadcasts across **{d.get('events', 0)}** events, "
                    f"**{d.get('awaitingProcessing', 0)}** awaiting processing, "
                    f"**{d.get('published', 0)}** published")
              dateless = sum(1 for b in body.get("broadcasts") or []
                             if not b.get("publishedAt"))
              print(f"- Broadcasts still without an air date: {dateless}")
          except Exception as exc:
              print(f"- Site discovery layer: could not be read ({exc})")
          if errs:
              print(f"- Source errors: **{len(errs)}**")
              for e in errs:
                  print(f"  - `{e}`")
          else:
              print("- Source errors: none")
          PY
          ERRS=$(python3 -c "import json;print(len(json.load(open('assets/data/matchfinder.v1.json')).get('sourceErrors') or []))")
          echo "source_errors=$ERRS" >> "$GITHUB_OUTPUT"
          if [ "$ERRS" != "0" ]; then
            echo "::warning::$ERRS source error(s) this scan — the snapshot still holds every previously-found broadcast (the ledger is an archive, not a window)."
          fi

      - name: Validate the snapshot before committing
        if: env.DRY_RUN != 'true'
        run: |
          python3 pipeline/test_match_finder.py
          python3 pipeline/test_self_fill.py
          python3 pipeline/check_packaging.py

      - name: Commit the refreshed snapshot if it changed
        id: commit
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "owcs-matchfinder[bot]"
          git config user.email "actions@users.noreply.github.com"
          # ONLY the two discovery artifacts. Never the DB, the published
          # dataset or a layout: a discovery scan has no business touching
          # any of those. discovered.v1.js is derived from the snapshot in
          # the same command that wrote it, so the pair is always in step.
          git add assets/data/matchfinder.v1.json assets/data/discovered.v1.js
          if git diff --cached --quiet; then
            echo "No new broadcasts and no changed metadata this scan."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: auto match finder snapshot ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # Bounded rebase-retry. A single pull+push loses the scan outright
          # if any push lands in the window between them: the ledger this
          # snapshot was built from is gitignored runtime state that only
          # exists on this runner, so a rejected push discards real findings
          # rather than merely deferring them.
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            echo "::warning::push attempt ${attempt} rejected (a concurrent push landed) — rebasing and retrying"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::could not push the match-finder snapshot after 3 rebase attempts"
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN deliberately does NOT
      # trigger other workflows (GitHub's anti-recursion safeguard on
      # push/pull_request events) — so without this step, every scheduled
      # scan could commit real broadcasts forever and pages.yml would never
      # redeploy, leaving the live site stuck on whatever a HUMAN last
      # pushed. workflow_dispatch called explicitly via the API is exempt
      # from that safeguard, so triggering it here (only when something
      # actually changed) is what makes "the site updates itself" real
      # rather than aspirational.
      - name: Trigger a Pages redeploy
        if: env.DRY_RUN != 'true' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: match-finder-${{ github.run_id }}
          path: run-output.txt
          retention-days: 30
          if-no-files-found: warn
