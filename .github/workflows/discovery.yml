# =====================================================================
# OWCS Comp Tracker — discovery + FACEIT registry ops (Roadmap Phase B)
# ---------------------------------------------------------------------
# Hourly it runs the FACEIT + official-calendar discovery sync. It is
# SAFE BY DEFAULT:
#
#   * With the registries still disabled (placeholder ids) or no
#     FACEIT_API_KEY secret configured, the scheduled run only does a
#     --dry-run health check that writes nothing and opens nothing.
#   * Once real championship ids are enabled in
#     config/faceit_competitions.json AND the FACEIT_API_KEY secret is
#     set, the scheduled run does a live sync, regenerates the public
#     calendar export, validates it, and opens a DATA-UPDATE pull request
#     ONLY when the validated calendar data actually changes.
#
# workflow_dispatch adds READ-ONLY registry-config modes that use the
# FACEIT_API_KEY / YOUTUBE_API_KEY secrets but never write to the repo:
#   mode=candidates       list OW2 championships + organizers to confirm ids
#   mode=verify           verify every ENABLED competition via the FACEIT API
#   mode=dryrun            rolling FACEIT+calendar discovery dry-run (lookback_days input)
#   mode=verify-channels   verify every configured YouTube channel (C1)
#   mode=calendar-dryrun   official-calendar dry-run + reconciliation (C7)
#   mode=broadcast-dryrun  YouTube broadcast discovery + matching, read-only (C3/C4)
#   mode=teams-dryrun      team profile enrichment (bio/website/socials), read-only (D)
#   mode=coverage          print the rolling completeness + broadcast-coverage report
#   mode=team-coverage     per-team identity/roster/logo/broadcast/capture ledger (D2)
#   mode=team-assets-dryrun  promote+list ranked logo candidates, read-only (D2;
#                            never approves or publishes anything)
#   mode=match-audit        per-match fixture/lifecycle audit, read-only (D2.1;
#                           never writes — see mode=sync's repair step for writes)
#   mode=match-repair-dryrun  match metadata repair dry-run report, read-only (D2.1)
#   mode=export-dryrun      match export coverage report — why every excluded
#                           match isn't public yet, read-only (D2.1)
#   mode=sync              (default) same as the scheduled run — now also runs LIVE
#                          team enrichment + opens (and auto-merges once green) a
#                          data-update PR when calendar or team facts change
#
# Every YouTube mode is read-only: no video download, no recording, no hero-
# composition writes, no production DB update, no auto-merge. Only sanitized
# text summaries (stdout, which the CLI itself never lets a key reach — see
# pipeline/automation/youtube_api.py's URL sanitization) are saved as a
# workflow artifact; no runtime DB, API cache, or raw API response is ever
# committed or uploaded.
#
# Recording/segmentation/CV are NOT part of this workflow — discovery is
# lightweight and never downloads a VOD.
# =====================================================================
name: discovery

on:
  schedule:
    # Hourly at :17 to stay clear of the top-of-hour runner congestion.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sync | candidates | verify | dryrun | verify-channels | calendar-dryrun | broadcast-dryrun | teams-dryrun | coverage | team-coverage | team-assets-dryrun | match-audit | match-repair-dryrun | export-dryrun"
        required: false
        default: "sync"
      query:
        description: "championship name search (candidates mode)"
        required: false
        default: "OWCS"
      org:
        description: "comma-separated organizer ids to list championships for (candidates mode)"
        required: false
        default: ""
      lookback_days:
        description: "Rolling lookback window (days)"
        required: false
        default: "30"

concurrency:
  group: owcs-discovery
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      MODE: ${{ github.event.inputs.mode || 'sync' }}
      QUERY: ${{ github.event.inputs.query || 'OWCS' }}
      LOOKBACK: ${{ github.event.inputs.lookback_days || '30' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Discovery + export are stdlib-only; no opencv/ffmpeg needed here.

      - name: Detect readiness (enabled competitions + secret)
        id: gate
        run: |
          ENABLED=$(python3 - <<'PY'
          import sys; sys.path.insert(0, "pipeline")
          from automation import config as c
          print(len(c.load_competitions()))
          PY
          )
          echo "enabled_competitions=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ -n "$FACEIT_API_KEY" ]; then echo "has_key=true" >> "$GITHUB_OUTPUT"; else echo "has_key=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$YOUTUBE_API_KEY" ]; then echo "has_youtube_key=true" >> "$GITHUB_OUTPUT"; else echo "has_youtube_key=false" >> "$GITHUB_OUTPUT"; fi
          echo "Mode: $MODE ; enabled competitions: $ENABLED ; FACEIT key present: $([ -n "$FACEIT_API_KEY" ] && echo yes || echo no) ; YouTube key present: $([ -n "$YOUTUBE_API_KEY" ] && echo yes || echo no)"

      # -------- READ-ONLY registry-config modes (no repo writes) ----------
      - name: List candidate championships + organizers (mode=candidates)
        if: github.event.inputs.mode == 'candidates'
        env:
          ORGS: ${{ github.event.inputs.org }}
        run: |
          if [ -z "$FACEIT_API_KEY" ]; then echo "::error::FACEIT_API_KEY not set"; exit 1; fi
          echo "::group::organizers matching 'Overwatch'"
          python3 pipeline/automation/cli.py list-organizers --query "Overwatch" || true
          echo "::endgroup::"
          if [ -n "$ORGS" ]; then
            IFS=',' read -ra OA <<< "$ORGS"
            for O in "${OA[@]}"; do
              echo "::group::organizer $O championships (json, authoritative ids)"
              python3 pipeline/automation/cli.py list-championships --organizer "$O" --json || true
              echo "::endgroup::"
            done
          else
            for Q in "$QUERY" "OWCS 2026" "OWCS 2026 Stage"; do
              echo "::group::championships name~'$Q' (all, json)"
              python3 pipeline/automation/cli.py list-championships --query "$Q" --type all --limit 30 --json || true
              echo "::endgroup::"
            done
          fi
          echo "Confirm the OFFICIAL organizer id, then verify each championship id with mode=verify."

      - name: Verify enabled competitions (mode=verify)
        if: github.event.inputs.mode == 'verify'
        run: |
          if [ -z "$FACEIT_API_KEY" ]; then echo "::error::FACEIT_API_KEY not set"; exit 1; fi
          python3 pipeline/automation/cli.py verify-registry

      - name: Rolling discovery dry-run (mode=dryrun)
        if: github.event.inputs.mode == 'dryrun'
        run: |
          if [ -z "$FACEIT_API_KEY" ]; then echo "::error::FACEIT_API_KEY not set"; exit 1; fi
          python3 pipeline/automation/cli.py sync-all --dry-run --lookback-days "$LOOKBACK"
          echo "::group::coverage (read-only)"
          python3 pipeline/automation/cli.py coverage --window "$LOOKBACK" || true
          echo "::endgroup::"

      # -------- READ-ONLY YouTube broadcast-discovery modes (Phase C) -----
      # Every command below only ever prints sanitized text (no key can
      # reach stdout — see youtube_api.py's URL sanitization) and never
      # writes to the repo; output is captured to a file and uploaded as a
      # workflow artifact in the "Upload sanitized run output" step below.
      #
      # Every step here is `shell: bash` with `set -euo pipefail` explicit
      # (never relying on whatever the runner's implicit default happens to
      # be) — this is the fix for the discovery #28 false-success incident:
      # `python3 ... | tee run-output.txt` alone lets `tee`'s own zero exit
      # status hide a failing `python3` (ModuleNotFoundError: cv2, in that
      # case), so the step reported green with a ~144-byte artifact. Now:
      # stdout+stderr are both captured (`2>&1` before the pipe), `pipefail`
      # makes the pipeline's exit status the FIRST failing command's (i.e.
      # python3's, not tee's), and `test -s run-output.txt` hard-fails the
      # step if the report is empty for any other reason. A real failure
      # here now fails this step, fails the job, and shows red in Actions —
      # never a silent, near-empty "success".
      - name: Verify configured YouTube channels (mode=verify-channels)
        if: github.event.inputs.mode == 'verify-channels'
        id: verify_channels
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "::error::YOUTUBE_API_KEY not set"; exit 1; fi
          python3 pipeline/automation/cli.py verify-channels 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      - name: Official-calendar dry-run + reconciliation (mode=calendar-dryrun)
        if: github.event.inputs.mode == 'calendar-dryrun'
        id: calendar_dryrun
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/automation/cli.py calendar-dryrun --lookback-days "$LOOKBACK" 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      - name: YouTube broadcast discovery + matching, read-only (mode=broadcast-dryrun)
        if: github.event.inputs.mode == 'broadcast-dryrun'
        id: broadcast_dryrun
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "::error::YOUTUBE_API_KEY not set"; exit 1; fi
          python3 pipeline/automation/cli.py broadcast-dryrun --lookback-days "$LOOKBACK" 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      - name: Rolling completeness + broadcast coverage (mode=coverage)
        if: github.event.inputs.mode == 'coverage'
        id: coverage_report
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/automation/cli.py coverage --window "$LOOKBACK" 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      - name: Team profile enrichment, read-only (mode=teams-dryrun)
        if: github.event.inputs.mode == 'teams-dryrun'
        id: teams_dryrun
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FACEIT_API_KEY" ]; then echo "::error::FACEIT_API_KEY not set"; exit 1; fi
          python3 pipeline/automation/cli.py enrich-teams --dry-run 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      - name: Team coverage report (mode=team-coverage)
        if: github.event.inputs.mode == 'team-coverage'
        id: team_coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/automation/cli.py team-coverage --window "$LOOKBACK" 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      - name: Team asset candidate collection, read-only (mode=team-assets-dryrun)
        if: github.event.inputs.mode == 'team-assets-dryrun'
        id: team_assets_dryrun
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/automation/cli.py collect-team-assets 2>&1 | tee run-output.txt
          echo "" >> run-output.txt
          python3 pipeline/automation/cli.py publish-team-assets >> run-output.txt 2>&1
          test -s run-output.txt
          wc -c run-output.txt

      - name: Per-match fixture/lifecycle audit, read-only (mode=match-audit)
        if: github.event.inputs.mode == 'match-audit'
        id: match_audit
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/automation/cli.py match-audit 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      - name: Match repair dry-run report, read-only (mode=match-repair-dryrun)
        if: github.event.inputs.mode == 'match-repair-dryrun'
        id: match_repair_dryrun
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/automation/cli.py match-repair --coverage 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      - name: Match export coverage report, read-only (mode=export-dryrun)
        if: github.event.inputs.mode == 'export-dryrun'
        id: export_dryrun
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/automation/cli.py export-coverage 2>&1 | tee run-output.txt
          test -s run-output.txt
          wc -c run-output.txt

      # if: contains(...) carries an IMPLICIT success() — GitHub Actions
      # only adds that when the expression uses none of always()/failure()/
      # cancelled(); a plain expression like this one already means "only
      # if every previous step succeeded". So neither of the two steps below
      # ever runs (and neither can claim/imply success) after a report step
      # above has failed — the job simply stays red, with the traceback
      # visible in that failed step's own log.
      - name: Append sanitized report to job summary
        if: contains(fromJSON('["verify-channels","calendar-dryrun","broadcast-dryrun","teams-dryrun","coverage","team-coverage","team-assets-dryrun","match-audit","match-repair-dryrun","export-dryrun"]'), github.event.inputs.mode)
        shell: bash
        run: |
          set -euo pipefail
          test -s run-output.txt
          {
            echo "### Discovery report — mode: ${MODE}"
            echo ""
            echo '```text'
            cat run-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized run output
        if: contains(fromJSON('["verify-channels","calendar-dryrun","broadcast-dryrun","teams-dryrun","coverage","team-coverage","team-assets-dryrun","match-audit","match-repair-dryrun","export-dryrun"]'), github.event.inputs.mode)
        uses: actions/upload-artifact@v6
        with:
          name: discovery-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: run-output.txt
          retention-days: 30
          if-no-files-found: error

      # -------- default/scheduled SYNC path (unchanged, safe) -------------
      - name: Dry-run health check (sync mode; always safe, writes nothing)
        if: env.MODE == 'sync'
        run: |
          python3 pipeline/automation/cli.py sync-all --dry-run --lookback-days "$LOOKBACK"

      - name: Match metadata repair — fixture_kind/lifecycle_status backfill (D2.1)
        id: match_repair
        # Needs no API key — pure evidence-based repair of rows already in
        # data/owcs.sqlite (see pipeline/automation/match_repair.py). Runs
        # every sync so a legacy match's export gap never lingers on a
        # schedule with registries disabled / no secret configured.
        if: env.MODE == 'sync'
        run: |
          python3 pipeline/automation/cli.py match-repair --write --coverage
          python3 pipeline/export_data.py --public

      - name: Live sync + regenerate public calendar
        id: sync
        if: env.MODE == 'sync' && steps.gate.outputs.enabled_competitions != '0' && steps.gate.outputs.has_key == 'true'
        run: |
          python3 pipeline/automation/cli.py sync-all --lookback-days "$LOOKBACK" --export
          python3 pipeline/automation/cli.py coverage --save || true

      - name: Live team enrichment (Phase D — bio/website/socials/roster facts)
        id: teams
        # Runs off teams discovery already resolved a faceit_team_id for, so
        # it works even if enabled_competitions is 0 this run (existing
        # teams still get refreshed). Never writes a logo — only fact
        # columns + candidate sources for the human-verified asset workflow.
        if: env.MODE == 'sync' && steps.gate.outputs.has_key == 'true'
        run: |
          python3 pipeline/automation/cli.py enrich-teams --export

      - name: Validate before publishing
        id: validate
        if: steps.match_repair.conclusion == 'success' || steps.sync.conclusion == 'success' || steps.teams.conclusion == 'success'
        run: |
          python3 pipeline/check_packaging.py
          python3 pipeline/test_automation_calendar_export.py
          python3 pipeline/test_automation_match_repair.py
          python3 pipeline/test_match_export_coverage.py
          python3 pipeline/test_public_site.py

      - name: Open data-update PR if the calendar or team data changed
        id: pr
        if: steps.validate.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "owcs-discovery[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/data.js assets/data/public_data.v1.js data/owcs.sqlite \
                  assets/data/team_asset_sources.json assets/data/team_coverage.v1.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated calendar/team changes this run — nothing to publish."
            exit 0
          fi
          BR="auto/discovery-$(date -u +'%Y%m%d-%H%M')"
          git checkout -b "$BR"
          git commit -m "data: discovery calendar + team update ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push origin "$BR"
          gh pr create \
            --title "Discovery calendar + team update ($(date -u +'%Y-%m-%d %H:%M') UTC)" \
            --body "Automated FACEIT calendar sync + team profile enrichment. Only validated facts (no compositions, no logos — image URLs land as candidate sources for human verification only). Generated by the hourly discovery workflow." \
            --base "${GITHUB_REF_NAME}" --head "$BR" || echo "PR may already exist."
          # Merge once this branch's own CI (ci.yml) goes green. `gh pr merge
          # --auto` needs branch protection with required checks configured
          # on main to have anything to wait on — this repo has none, so
          # --auto silently no-ops. Poll the check directly instead: block
          # until it reports a conclusion, then merge ONLY on success. A
          # failing or timed-out check leaves the PR open for a human —
          # never force-merged, never bypassed.
          if gh pr checks "$BR" --watch --fail-fast; then
            gh pr merge --squash --delete-branch "$BR"
          else
            echo "CI on $BR did not pass — leaving the PR open for review."
          fi

      - name: Summary
        if: always()
        env:
          # One of these is set when its mode ran; the rest are empty. Never
          # printed as "success" unless the step itself actually concluded
          # that way — a failed/cancelled report step shows exactly that.
          REPORT_STEP_CONCLUSION: >-
            ${{ steps.verify_channels.conclusion || steps.calendar_dryrun.conclusion
             || steps.broadcast_dryrun.conclusion || steps.coverage_report.conclusion
             || steps.teams_dryrun.conclusion || steps.team_coverage.conclusion
             || steps.team_assets_dryrun.conclusion || steps.match_audit.conclusion
             || steps.match_repair_dryrun.conclusion || steps.export_dryrun.conclusion
             || '' }}
        run: |
          {
            echo "### Discovery run — mode: ${MODE}"
            echo ""
            echo "- Enabled competitions: ${{ steps.gate.outputs.enabled_competitions }}"
            echo "- FACEIT key present: ${{ steps.gate.outputs.has_key }}"
            echo "- YouTube key present: ${{ steps.gate.outputs.has_youtube_key }}"
            if [ -n "$REPORT_STEP_CONCLUSION" ]; then
              echo "- Report step ($MODE): $REPORT_STEP_CONCLUSION"
              if [ "$REPORT_STEP_CONCLUSION" != "success" ]; then
                echo "  **FAILED — see the step log above for the full traceback. No artifact was uploaded.**"
              fi
            fi
            echo "- Match metadata repair: ${{ steps.match_repair.conclusion || 'skipped' }}"
            echo "- Team enrichment: ${{ steps.teams.conclusion || 'skipped' }}"
            echo "- Data-update PR: ${{ steps.pr.conclusion || 'skipped' }} (auto-merges once its own CI is green)"
          } >> "$GITHUB_STEP_SUMMARY"
